<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14171A">
<title>Stock Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#14171A;
    --panel:#1C2024;
    --panel-alt:#22262B;
    --border:#2C3238;
    --text:#E7E5E0;
    --text-dim:#8A9099;
    --accent:#F2A93B;
    --accent-dim:#C98A2E;
    --badge:#4FD6C0;
    --badge-text:#0B1512;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--border);
  }

  .titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }

  h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }

  .status{
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .search-row{
    display:flex;
    gap:8px;
  }

  .search-row.secondary{
    margin-top:8px;
  }

  input[type="search"]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    padding:12px 14px;
    outline:none;
    min-width:0;
  }

  input[type="search"]:focus{
    border-color:var(--accent-dim);
  }

  input[type="search"]::placeholder{
    color:var(--text-dim);
  }

  .load-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:0 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }

  .load-btn:active{
    background:var(--border);
  }

  #file-input{ display:none; }

  main{
    flex:1;
    overflow-y:auto;
    padding:6px 0 40px;
  }

  .count-row{
    padding:12px 18px 4px;
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
  }

  .row{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }

  .row-main{ min-width:0; }

  .code-line{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .code{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:14.5px;
    color:var(--accent);
    letter-spacing:0.3px;
  }

  .uom-badge,
  .loc-badge{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:var(--badge-text);
    background:var(--badge);
    border-radius:7px;
    padding:5px 10px;
    line-height:1.3;
    flex-shrink:0;
    white-space:nowrap;
  }

  .name{
    font-size:13.5px;
    color:var(--text);
    margin-top:3px;
    line-height:1.4;
  }



  .empty{
    padding:60px 30px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
  }

  .empty strong{
    display:block;
    color:var(--text);
    font-size:15px;
    margin-bottom:6px;
    font-weight:600;
  }

  .demo-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--bg);
    background:var(--accent);
    padding:2px 6px;
    border-radius:4px;
    margin-left:6px;
    vertical-align:middle;
  }

  .splash{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    z-index:9999;
    animation: splash-out 0.5s ease 6.1s forwards;
  }

  .splash-stage{
    position:relative;
    width:160px;
    height:160px;
    flex-shrink:0;
  }

  .warehouse-icon{ position:absolute; inset:0; }

  .wh-shutter{
    -webkit-clip-path: inset(0 0 0% 0);
    clip-path: inset(0 0 0% 0);
    animation: shutter-open 1.1s ease-in 0.5s forwards;
  }

  .wh-box{
    transform-box: fill-box;
    transform-origin: center;
    opacity:0;
    transform: scale(0.25);
  }
  .wh-box.pop-1{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 2.0s forwards; }
  .wh-box.pop-2{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 2.7s forwards; }
  .wh-box.pop-3{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 3.4s forwards; }

  .glass-wrap{
    position:absolute;
    top:0; left:0;
    width:56px;
    height:56px;
    animation: glass-move 2s cubic-bezier(.45,0,.2,1) forwards;
  }

  .splash-logo{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:20px;
    letter-spacing:5px;
    color:var(--accent);
    opacity:0;
    transform: translateX(-260px);
    animation: logo-slide-in 1.1s cubic-bezier(.16,.84,.44,1) 4.5s forwards;
  }

  @keyframes shutter-open{
    to{ -webkit-clip-path: inset(0 0 100% 0); clip-path: inset(0 0 100% 0); }
  }

  @keyframes box-pop{
    0%   { opacity:0; transform: scale(0.25); }
    60%  { opacity:1; transform: scale(1.15); }
    100% { opacity:1; transform: scale(1); }
  }

  @keyframes glass-move{
    0%   { transform: translate(10px, 93px); opacity:1; }
    25%  { transform: translate(96px, 20px); }
    50%  { transform: translate(26px, 13px); }
    75%  { transform: translate(90px, 96px); }
    88%  { transform: translate(58px, 58px); opacity:1; }
    100% { transform: translate(58px, 58px); opacity:0; }
  }

  @keyframes logo-slide-in{
    0%   { transform: translateX(-260px); opacity:0; }
    60%  { opacity:1; }
    100% { transform: translateX(0); opacity:1; }
  }

  @keyframes splash-out{
    to{ opacity:0; visibility:hidden; }
  }

  .code-line{ flex-wrap:wrap; }

  .qr-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:23px;
    height:23px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel-alt);
    color:var(--text-dim);
    flex-shrink:0;
    padding:0;
    cursor:pointer;
  }
  .qr-btn svg{ width:13px; height:13px; }
  .qr-btn:active{ background:var(--border); }

  .loc-wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
  }

  .qr-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:24px;
  }
  .qr-overlay.hidden{ display:none; }

  .qr-card{
    background:#F5F4F0;
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:280px;
    width:100%;
  }
  #qr-canvas-holder{
    width:220px;
    height:220px;
    background:#fff;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .qr-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#14171A;
    text-align:center;
    word-break:break-all;
  }
  .qr-close{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#14171A;
    background:#E2DFD6;
    border:none;
    border-radius:8px;
    padding:9px 20px;
    cursor:pointer;
  }

  .scan-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    width:44px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    cursor:pointer;
    padding:0;
  }
  .scan-btn svg{ width:18px; height:18px; }
  .scan-btn:active{ background:var(--border); }

  .scan-btn.listening{
    background:var(--accent);
    color:var(--bg);
    animation:mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.5; }
  }

  #scan-region{
    width:240px;
    max-width:100%;
    border-radius:8px;
    overflow:hidden;
  }

  .scan-actions{
    display:flex;
    gap:10px;
  }

  #scan-torch.on{
    background:var(--accent);
    color:var(--bg);
  }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-stage">
    <svg class="warehouse-icon" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#4FD6C0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 130 L38 78 L28 78 L80 20 L132 78 L122 78 L122 130"/>
        <line x1="58" y1="48" x2="102" y2="48"/>
        <line x1="58" y1="62" x2="102" y2="62"/>
        <rect x="52" y="88" width="56" height="42"/>
      </g>
      <g class="wh-shutter">
        <rect x="55" y="91" width="50" height="36" fill="#4FD6C0" fill-opacity="0.15" stroke="none"/>
        <line x1="55" y1="100" x2="105" y2="100" stroke="#4FD6C0" stroke-width="3"/>
        <line x1="55" y1="109" x2="105" y2="109" stroke="#4FD6C0" stroke-width="3"/>
        <line x1="55" y1="118" x2="105" y2="118" stroke="#4FD6C0" stroke-width="3"/>
      </g>
      <g stroke="#4FD6C0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect class="wh-box pop-1" x="55" y="110" width="19" height="18"/>
        <rect class="wh-box pop-2" x="85" y="110" width="19" height="18"/>
        <rect class="wh-box pop-3" x="70" y="92" width="19" height="18"/>
      </g>
    </svg>
    <div class="glass-wrap">
      <svg class="glass-icon" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="14" fill="none" stroke="#F2A93B" stroke-width="6"/>
        <circle cx="22" cy="22" r="5" fill="#4FD6C0"/>
        <line x1="32" y1="32" x2="46" y2="46" stroke="#F2A93B" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="splash-logo">WyApps</div>
</div>
<div class="app">
  <header>
    <div class="titlebar">
      <h1>Stock Finder</h1>
      <span class="status" id="status">demo data<span class="demo-tag">SAMPLE</span></span>
    </div>
    <div class="search-row">
      <input type="search" id="search" placeholder="Search code or description..." autocomplete="off">
      <button class="scan-btn" id="mic-trigger" aria-label="Search by voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="load-btn" id="load-trigger">Load File</button>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
    </div>
    <div class="search-row secondary">
      <input type="search" id="search-location" placeholder="Search location..." autocomplete="off">
      <button class="scan-btn" id="scan-trigger" aria-label="Scan a QR code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="count-row" id="count-row"></div>
    <div id="results"></div>
  </main>
</div>

<div class="qr-overlay hidden" id="qr-overlay">
  <div class="qr-card">
    <div id="qr-canvas-holder"></div>
    <div class="qr-label" id="qr-label"></div>
    <button class="qr-close" id="qr-close">Close</button>
  </div>
</div>

<div class="qr-overlay hidden" id="scan-overlay">
  <div class="qr-card">
    <div id="scan-region"></div>
    <div class="qr-label" id="scan-hint">Point the camera at a QR code</div>
    <div class="scan-actions">
      <button class="qr-close" id="scan-torch" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Torch
      </button>
      <button class="qr-close" id="scan-close">Cancel</button>
    </div>
  </div>
</div>

<script>
  // ---- Column mapping: matches the Pick Spreadsheet headers ----
  // Locator | Item | Item Description | Rev | Primary UOM | On-hand
  const COLUMNS = {
    code: 'Item',
    name: 'Item Description',
    location: 'Locator',
    uom: 'Primary UOM'
  };

  // ---- QR format: matches your warehouse's real labels ----
  // Item QR = just the bare item code (confirmed from a real label, e.g. "MXA085")
  // Location QR = a prefix + the locator text (confirmed from a real label: "1LPICK#CC.0.0.020")
  // Only tested against one location label so far — if a QR from a different
  // aisle/zone ever decodes with a different prefix, update this constant.
  const LOCATION_QR_PREFIX = '1LPICK#';

  // Item barcodes on the pallet/LPN labels (the Code 128 ones, not the shelf
  // QR tags) come out with a leading "P" that isn't shown in the printed
  // "Item No" text — e.g. scanning "EVE063" actually decodes as "PEVE063".
  // Stripping just the first character removes that system prefix.
  // Based on a handful of scans so far — flag it if a different prefix
  // letter ever turns up on a different label type.
  const ITEM_SCAN_PREFIX = 'P';

  const QR_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="14" width="2" height="2"/></svg>`;

  // A handful of real-shaped rows so the app is usable before you load your file
  const SAMPLE_ROWS = [
    { Locator: 'Loc A', Item: 'Product 1', 'Item Description': 'Product 1 Description goes here.', 'Primary UOM': 'UOM 1' },
    { Locator: 'Loc B', Item: 'Product 2', 'Item Description': 'Product 2 Description goes here.', 'Primary UOM': 'UOM 2' },
    { Locator: 'Loc C', Item: 'Product 3', 'Item Description': 'Product 3 Description goes here.', 'Primary UOM': 'UOM 3' },
    { Locator: 'Loc D', Item: 'Product 4', 'Item Description': 'Product 4 Description goes here.', 'Primary UOM': 'UOM 4' },
    { Locator: 'Loc E', Item: 'Product 5', 'Item Description': 'Product 5 Description goes here.', 'Primary UOM': 'UOM 5' }
  ];

  let items = [];
  const searchEl = document.getElementById('search');
  const searchLocationEl = document.getElementById('search-location');
  const resultsEl = document.getElementById('results');
  const countRowEl = document.getElementById('count-row');
  const statusEl = document.getElementById('status');
  const loadTrigger = document.getElementById('load-trigger');
  const fileInput = document.getElementById('file-input');
  const qrOverlayEl = document.getElementById('qr-overlay');
  const qrHolderEl = document.getElementById('qr-canvas-holder');
  const qrLabelEl = document.getElementById('qr-label');
  const qrCloseEl = document.getElementById('qr-close');
  const scanTrigger = document.getElementById('scan-trigger');
  const scanOverlayEl = document.getElementById('scan-overlay');
  const scanHintEl = document.getElementById('scan-hint');
  const scanCloseEl = document.getElementById('scan-close');
  const scanTorchEl = document.getElementById('scan-torch');
  const micTrigger = document.getElementById('mic-trigger');
  let html5QrScanner = null;
  let torchOn = false;

  // ---- Sound: tiny generated tones, no audio files needed ----
  let audioCtx = null;
  function getAudioContext(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }
  // Unlock audio on the very first tap anywhere, so sounds triggered later
  // (e.g. from an async scan callback) are reliably audible.
  document.addEventListener('pointerdown', () => getAudioContext(), { once: true });

  function playTone({freq, duration = 150, type = 'sine', volume = 0.18, delay = 0}){
    const ctx = getAudioContext();
    if(!ctx) return;
    try{
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration / 1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration / 1000 + 0.03);
    }catch(e){}
  }

  function playScanBeep(){
    playTone({ freq: 1600, duration: 100, volume: 0.2 });
  }

  function playNoMatchTone(){
    playTone({ freq: 210, duration: 180, volume: 0.12 });
  }

  function playSplashFlourish(){
    playTone({ freq: 523.25, duration: 110, volume: 0.15, delay: 0 });
    playTone({ freq: 659.25, duration: 110, volume: 0.15, delay: 0.09 });
    playTone({ freq: 783.99, duration: 170, volume: 0.16, delay: 0.18 });
  }

  function playPopSound(pitch = 1){
    const ctx = getAudioContext();
    if(!ctx) return;
    try{
      const t0 = ctx.currentTime;
      const base = 500 * pitch;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * 1.8, t0);
      osc.frequency.exponentialRampToValueAtTime(base * 0.6, t0 + 0.09);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.13);
    }catch(e){}
  }

  function rowsToItems(rows){
    return rows.map(r => ({
      code: String(r[COLUMNS.code] ?? '').trim(),
      name: String(r[COLUMNS.name] ?? '').trim(),
      location: String(r[COLUMNS.location] ?? '').trim(),
      uom: String(r[COLUMNS.uom] ?? '').trim()
    })).filter(i => i.code || i.name);
  }

  function parseSpreadsheet(arrayBuffer){
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    return rowsToItems(rows);
  }

  let wasNoMatch = false;

  function render(list){
    if(items.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No file loaded</strong>Load your pick spreadsheet to start searching.</div>`;
      countRowEl.textContent = '';
      wasNoMatch = false;
      return;
    }
    if(list.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No matches</strong>Try a different code, description or location.</div>`;
      countRowEl.textContent = '';
      if(!wasNoMatch) playNoMatchTone();
      wasNoMatch = true;
      return;
    }
    wasNoMatch = false;
    countRowEl.textContent = `${list.length} of ${items.length} items`;
    resultsEl.innerHTML = list.map(i => `
      <div class="row">
        <div class="row-main">
          <div class="code-line">
            <span class="code">${escapeHTML(i.code)}</span>
            ${i.uom ? `<span class="uom-badge">${escapeHTML(i.uom)}</span>` : ''}
            ${i.code ? `<button class="qr-btn" data-qr="${escapeHTML(i.code)}" aria-label="Show QR for item code">${QR_ICON_SVG}</button>` : ''}
          </div>
          <div class="name">${escapeHTML(i.name)}</div>
        </div>
        ${i.location ? `
        <div class="loc-wrap">
          <div class="loc-badge">${escapeHTML(i.location)}</div>
          <button class="qr-btn" data-qr="${escapeHTML(LOCATION_QR_PREFIX + i.location)}" aria-label="Show QR for location">${QR_ICON_SVG}</button>
        </div>` : ''}
      </div>
    `).join('');
  }

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function doSearch(){
    const q = searchEl.value.trim().toLowerCase();
    const loc = searchLocationEl.value.trim().toLowerCase();
    let filtered = items;
    if(q){
      filtered = filtered.filter(i => i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q));
    }
    if(loc){
      filtered = filtered.filter(i => i.location.toLowerCase().includes(loc));
    }
    render(filtered);
  }

  function loadItems(list, label){
    items = list;
    statusEl.innerHTML = label;
    doSearch();
  }

  function showQR(text){
    qrLabelEl.textContent = text;
    qrHolderEl.innerHTML = '';
    new QRCode(qrHolderEl, {
      text: text,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
    qrOverlayEl.classList.remove('hidden');
  }

  function hideQR(){
    qrOverlayEl.classList.add('hidden');
  }

  resultsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.qr-btn');
    if(!btn) return;
    showQR(btn.dataset.qr);
  });

  qrOverlayEl.addEventListener('click', (e) => {
    if(e.target === qrOverlayEl) hideQR();
  });
  qrCloseEl.addEventListener('click', hideQR);

  function startScan(){
    scanHintEl.textContent = 'Point the camera at a QR code';
    scanTorchEl.hidden = true;
    scanTorchEl.classList.remove('on');
    torchOn = false;
    scanOverlayEl.classList.remove('hidden');
    html5QrScanner = new Html5Qrcode('scan-region');
    html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 200 },
      onScanSuccess,
      () => {} // ignore per-frame "no code found" noise
    ).then(() => {
      try{
        const torch = html5QrScanner.getRunningTrackCameraCapabilities().torchFeature();
        scanTorchEl.hidden = !(torch && torch.isSupported());
      }catch(e){
        scanTorchEl.hidden = true;
      }
    }).catch(() => {
      scanHintEl.textContent = "Couldn't access the camera — check camera permission for this app.";
    });
  }

  function stopScan(){
    if(html5QrScanner){
      const s = html5QrScanner;
      html5QrScanner = null;
      s.stop().then(() => s.clear()).catch(() => {});
    }
    scanOverlayEl.classList.add('hidden');
    scanTorchEl.hidden = true;
    scanTorchEl.classList.remove('on');
    torchOn = false;
  }

  scanTorchEl.addEventListener('click', () => {
    if(!html5QrScanner) return;
    try{
      const torch = html5QrScanner.getRunningTrackCameraCapabilities().torchFeature();
      torchOn = !torchOn;
      torch.apply(torchOn).then(() => {
        scanTorchEl.classList.toggle('on', torchOn);
      }).catch(() => {});
    }catch(e){}
  });

  function onScanSuccess(decodedText){
    stopScan();
    playScanBeep();
    if(decodedText.indexOf(LOCATION_QR_PREFIX) === 0){
      searchLocationEl.value = decodedText.slice(LOCATION_QR_PREFIX.length);
    } else if(decodedText.indexOf(ITEM_SCAN_PREFIX) === 0){
      searchEl.value = decodedText.slice(ITEM_SCAN_PREFIX.length);
    } else {
      searchEl.value = decodedText;
    }
    doSearch();
  }

  scanTrigger.addEventListener('click', startScan);
  scanCloseEl.addEventListener('click', stopScan);
  scanOverlayEl.addEventListener('click', (e) => {
    if(e.target === scanOverlayEl) stopScan();
  });

  // ---- Voice search (code/description field only — spoken location
  // codes like "CC.0.0.020" don't transcribe reliably) ----
  // Speech recognition tends to insert a space at letter/digit boundaries
  // (e.g. "MXA085" comes through as "MXA 085") and never capitalises —
  // this closes those gaps and uppercases for consistency with how codes
  // are shown everywhere else in the app.
  function cleanVoiceText(text){
    let t = text.trim().toUpperCase();
    t = t.replace(/([A-Z])\s+(\d)/g, '$1$2').replace(/(\d)\s+([A-Z])/g, '$1$2');
    return t;
  }

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function startVoiceSearch(){
    if(!SpeechRec) return;
    if(listening){
      recognition && recognition.stop();
      return;
    }
    recognition = new SpeechRec();
    recognition.lang = 'en-GB';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micTrigger.classList.add('listening');
    };
    recognition.onresult = (e) => {
      searchEl.value = cleanVoiceText(e.results[0][0].transcript);
      doSearch();
    };
    recognition.onerror = () => {};
    recognition.onend = () => {
      listening = false;
      micTrigger.classList.remove('listening');
    };
    recognition.start();
  }

  micTrigger.addEventListener('click', startVoiceSearch);

  searchEl.addEventListener('input', doSearch);
  searchLocationEl.addEventListener('input', doSearch);
  loadTrigger.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const parsed = parseSpreadsheet(evt.target.result);
        if(parsed.length === 0){
          throw new Error('No rows found — check the column headers match.');
        }
        loadItems(parsed, file.name);
      }catch(err){
        statusEl.textContent = 'Load failed';
        resultsEl.innerHTML = `<div class="empty"><strong>Couldn't read that file</strong>${escapeHTML(err.message)}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // start with sample data so the app is usable immediately
  loadItems(rowsToItems(SAMPLE_ROWS), 'demo data<span class="demo-tag">SAMPLE</span>');

  // Timed to the new splash sequence: door opens + glass sweeps (0-2s),
  // boxes pop in one at a time (2.0s/2.7s/3.4s), "WyApps" slides in (4.5s).
  // May be silently blocked by the browser on the very first open or two
  // (autoplay policy) until it's seen you interact with the app at least
  // once — the animation itself always plays regardless.
  setTimeout(() => playPopSound(1), 2000);
  setTimeout(() => playPopSound(1.15), 2700);
  setTimeout(() => playPopSound(1.3), 3400);
  setTimeout(playSplashFlourish, 4500);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
