<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<title>Stock Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#14171A;
    --panel:#1C2024;
    --panel-alt:#22262B;
    --border:#2C3238;
    --text:#E7E5E0;
    --text-dim:#8A9099;
    --accent:#F2A93B;
    --accent-dim:#C98A2E;
    --badge:#4FD6C0;
    --badge-text:#0B1512;
    --icon-border:#4B535C;
    --icon-color:#B9C0C7;
  }

  @media (prefers-color-scheme: light){
    :root{
      --bg:#F2F0EA;
      --panel:#FFFFFF;
      --panel-alt:#EAE7DF;
      --border:#DBD7CC;
      --text:#1C1F22;
      --text-dim:#6E7278;
      --icon-border:#DBD7CC;
      --icon-color:#6E7278;
    }
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--border);
  }

  .titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }

  h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }

  .status{
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    max-width:210px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    font-size:11.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:12px;
    border:1px solid transparent;
  }
  .status-pill.tier-green{
    background:rgba(111,191,115,0.16);
    border-color:rgba(111,191,115,0.4);
    color:#6FBF73;
  }
  .status-pill.tier-amber{
    background:rgba(242,169,59,0.16);
    border-color:rgba(242,169,59,0.4);
    color:var(--accent);
  }
  .status-pill.tier-red{
    background:rgba(230,90,90,0.16);
    border-color:rgba(230,90,90,0.4);
    color:#E65A5A;
  }

  .warn-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:300px;
    width:100%;
    text-align:center;
  }
  .warn-icon{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(230,90,90,0.16);
    color:#E65A5A;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
    flex-shrink:0;
  }
  .warn-text{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--text);
    line-height:1.5;
  }
  .warn-close{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--bg);
    background:var(--accent);
    border:none;
    border-radius:8px;
    padding:9px 24px;
    cursor:pointer;
  }

  .search-row{
    display:flex;
    gap:8px;
  }

  .search-row.secondary{
    margin-top:8px;
  }

  .search-wrap{
    position:relative;
    flex:1;
    min-width:0;
    display:flex;
  }

  input[type="search"]{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    padding:12px 34px 12px 14px;
    outline:none;
    min-width:0;
  }

  input[type="search"]::-webkit-search-cancel-button{
    -webkit-appearance:none;
    appearance:none;
  }

  input[type="search"]:focus{
    border-color:var(--accent-dim);
  }

  input[type="search"]::placeholder{
    color:var(--text-dim);
  }

  .clear-btn{
    position:absolute;
    right:5px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:19px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:6px;
    padding:0;
  }
  .clear-btn:active{ background:var(--border); }

  .recent-scans{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 18px 4px;
  }
  .recent-chip{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text);
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 12px;
    white-space:nowrap;
    cursor:pointer;
  }
  .recent-chip:active{ background:var(--border); }

  .load-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:0 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }

  .load-btn:active{
    background:var(--border);
  }

  .load-menu-wrap{
    position:relative;
    flex-shrink:0;
  }

  .load-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    z-index:50;
    min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .load-menu.hidden{ display:none; }

  .load-menu-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    width:100%;
    padding:10px 14px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--border);
    text-align:left;
    cursor:pointer;
  }
  .load-menu-item:last-child{ border-bottom:none; }
  .load-menu-item:active{ background:var(--panel-alt); }

  .load-menu-title{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
  }
  .load-menu-sub{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:11px;
    color:var(--text-dim);
  }

  #file-input, #usage-file-input{ display:none; }

  main{
    flex:1;
    overflow-y:auto;
    padding:6px 0 40px;
  }

  .count-row{
    padding:12px 18px 4px;
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
  }

  .row{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }

  .row-main{ min-width:0; }

  .code-line{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .code{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:14.5px;
    color:var(--accent);
    letter-spacing:0.3px;
  }

  .uom-badge,
  .loc-badge{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:var(--badge-text);
    background:var(--badge);
    border-radius:7px;
    padding:5px 10px;
    line-height:1.3;
    flex-shrink:0;
    white-space:nowrap;
  }

  .name{
    font-size:13.5px;
    color:var(--text);
    margin-top:3px;
    line-height:1.4;
  }



  .empty{
    padding:60px 30px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
  }

  .empty strong{
    display:block;
    color:var(--text);
    font-size:15px;
    margin-bottom:6px;
    font-weight:600;
  }

  .demo-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--bg);
    background:var(--accent);
    padding:2px 6px;
    border-radius:4px;
    margin-left:6px;
    vertical-align:middle;
  }

  .splash{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    z-index:9999;
    animation: splash-out 0.5s ease 5.0s forwards;
  }

  .splash-stage{
    position:relative;
    width:160px;
    height:160px;
    flex-shrink:0;
  }

  .warehouse-icon{ position:absolute; inset:0; }

  .wh-shutter{
    -webkit-clip-path: inset(0 0 0% 0);
    clip-path: inset(0 0 0% 0);
    animation: shutter-open 1.1s ease-in 0.5s forwards;
  }

  .wh-box{
    transform-box: fill-box;
    transform-origin: center;
    opacity:0;
    transform: scale(0.25);
  }
  .wh-box.pop-1{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 2.0s forwards; }
  .wh-box.pop-2{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 2.7s forwards; }
  .wh-box.pop-3{ animation: box-pop 0.55s cubic-bezier(.34,1.56,.64,1) 3.4s forwards; }

  .glass-wrap{
    position:absolute;
    top:0; left:0;
    width:56px;
    height:56px;
    animation: glass-move 1.6s cubic-bezier(.45,0,.2,1) forwards;
  }

  .splash-logo{
    font-family:'Fredoka', 'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:1px;
    color:var(--accent);
    opacity:0;
    transform: translateX(-260px);
    animation: logo-slide-in 1.1s cubic-bezier(.16,.84,.44,1) 3.4s forwards;
  }

  @keyframes shutter-open{
    to{ -webkit-clip-path: inset(0 0 100% 0); clip-path: inset(0 0 100% 0); }
  }

  @keyframes box-pop{
    0%   { opacity:0; transform: scale(0.25); }
    60%  { opacity:1; transform: scale(1.15); }
    100% { opacity:1; transform: scale(1); }
  }

  @keyframes glass-move{
    0%   { transform: translate(10px, 93px); opacity:1; }
    25%  { transform: translate(96px, 20px); }
    50%  { transform: translate(26px, 13px); }
    75%  { transform: translate(90px, 96px); }
    88%  { transform: translate(58px, 58px); opacity:1; }
    100% { transform: translate(58px, 58px); opacity:0; }
  }

  @keyframes logo-slide-in{
    0%   { transform: translateX(-260px); opacity:0; }
    60%  { opacity:1; }
    100% { transform: translateX(0); opacity:1; }
  }

  @keyframes splash-out{
    to{ opacity:0; visibility:hidden; }
  }

  .code-line{ flex-wrap:wrap; }

  .qr-btn, .info-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:23px;
    height:23px;
    border:1px solid var(--icon-border);
    border-radius:6px;
    background:var(--panel-alt);
    color:var(--icon-color);
    flex-shrink:0;
    padding:0;
    cursor:pointer;
  }
  .qr-btn svg, .info-btn svg{ width:13px; height:13px; }
  .qr-btn:active, .info-btn:active{ background:var(--border); }

  .add-list-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border:1px solid var(--accent-dim);
    border-radius:7px;
    background:transparent;
    color:var(--accent);
    flex-shrink:0;
    padding:0;
    cursor:pointer;
    align-self:center;
  }
  .add-list-btn svg{ width:15px; height:15px; }
  .add-list-btn:active{ background:var(--accent); color:var(--bg); }

  .loc-wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
  }

  .list-fab{
    position:fixed;
    right:20px;
    bottom:28px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--accent);
    color:var(--bg);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.45);
    z-index:400;
    touch-action:none;
    cursor:grab;
  }
  .list-fab svg{ width:22px; height:22px; }
  .list-fab-count{
    position:absolute;
    top:-4px;
    right:-4px;
    background:var(--badge);
    color:var(--badge-text);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:11px;
    min-width:18px;
    height:18px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 12px);
    background:var(--panel-alt);
    color:var(--text);
    border:1px solid var(--border);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:10px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:600;
    max-width:80%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .list-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:500;
  }
  .list-overlay.hidden{ display:none; }

  .list-panel{
    background:var(--bg);
    width:100%;
    max-width:480px;
    max-height:75vh;
    border-radius:16px 16px 0 0;
    border:1px solid var(--border);
    border-bottom:none;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .list-header-actions{ display:flex; gap:10px; align-items:center; }
  .list-clear-btn, .list-close-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    background:var(--panel-alt);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 13px;
    cursor:pointer;
  }
  .list-close-btn{ background:var(--accent); color:var(--bg); border-color:var(--accent); }

  #list-items{
    overflow-y:auto;
    padding-bottom:10px;
  }

  .list-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    border-bottom:1px solid var(--border);
    overflow:hidden;
    max-height:200px;
    transition:
      transform 0.25s ease,
      opacity 0.25s ease,
      max-height 0.3s ease 0.25s,
      padding-top 0.3s ease 0.25s,
      padding-bottom 0.3s ease 0.25s,
      border-color 0.3s ease 0.25s;
  }
  .list-row.removing{
    transform:translateX(-110%);
    opacity:0;
    max-height:0;
    padding-top:0;
    padding-bottom:0;
    border-color:transparent;
  }
  @media (prefers-reduced-motion: reduce){
    .list-row{
      transition:
        opacity 0.01s linear,
        max-height 0.01s linear,
        padding-top 0.01s linear,
        padding-bottom 0.01s linear,
        border-color 0.01s linear;
    }
  }
  .list-row .row-main{ min-width:0; flex:1; }
  .list-check-btn{
    flex-shrink:0;
    width:26px;
    height:26px;
    border:2px solid var(--icon-border);
    border-radius:7px;
    background:transparent;
    color:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .list-check-btn:active{ background:var(--panel-alt); }
  .list-check-btn.checked{
    background:var(--badge);
    border-color:var(--badge);
    color:var(--badge-text);
  }
  .list-check-btn:disabled{ cursor:default; }
  .list-check-icon{ width:15px; height:15px; }

  .list-empty{
    padding:40px 24px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
  }

  .qr-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:24px;
  }
  .qr-overlay.hidden{ display:none; }

  .qr-card{
    background:#F5F4F0;
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:280px;
    width:100%;
  }
  #qr-canvas-holder{
    width:220px;
    height:220px;
    background:#fff;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .qr-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#14171A;
    text-align:center;
    word-break:break-all;
  }
  .qr-close{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#14171A;
    background:#E2DFD6;
    border:none;
    border-radius:8px;
    padding:9px 20px;
    cursor:pointer;
  }

  .info-header{
    text-align:center;
    width:100%;
  }
  .info-header .code{
    display:block;
    font-size:16px;
    margin-bottom:4px;
  }
  .info-header .name{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    color:#5A5E63;
    line-height:1.4;
  }
  .info-stats{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .info-stat-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    border-bottom:1px solid #E2DFD6;
    padding-bottom:10px;
  }
  .info-stat-row:last-child{ border-bottom:none; padding-bottom:0; }
  .info-stat-label{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    color:#6E7278;
  }
  .info-stat-value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:16px;
    color:#14171A;
    white-space:nowrap;
  }
  .info-empty{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:#6E7278;
    text-align:center;
    line-height:1.6;
  }

  .scan-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    width:44px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    cursor:pointer;
    padding:0;
  }
  .scan-btn svg{ width:18px; height:18px; }
  .scan-btn:active{ background:var(--border); }

  .scan-btn.listening{
    background:var(--accent);
    color:var(--bg);
    animation:mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.5; }
  }

  #scan-region{
    width:240px;
    max-width:100%;
    border-radius:8px;
    overflow:hidden;
  }

  .scan-actions{
    display:flex;
    gap:10px;
  }

  #scan-torch.on{
    background:var(--accent);
    color:var(--bg);
  }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-stage">
    <svg class="warehouse-icon" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">

<script>
  // ---- Column mapping: matches the Pick Spreadsheet headers ----
  // Locator | Item | Item Description | Rev | Primary UOM | On-hand
  const COLUMNS = {
    code: 'Item',
    name: 'Item Description',
    location: 'Locator',
    uom: 'Primary UOM'
  };

  // ---- QR format: matches your warehouse's real labels ----
  // Item QR = just the bare item code (confirmed from a real label, e.g. "MXA085")
  // Location QR = a prefix + the locator text (confirmed from a real label: "1LPICK#CC.0.0.020")
  // Only tested against one location label so far — if a QR from a different
  // aisle/zone ever decodes with a different prefix, update this constant.
  const LOCATION_QR_PREFIX = '1LPICK#';

  // Item barcodes on the pallet/LPN labels (the Code 128 ones, not the shelf
  // QR tags) come out with a leading "P" that isn't shown in the printed
  // "Item No" text — e.g. scanning "EVE063" actually decodes as "PEVE063".
  // Stripping just the first character removes that system prefix.
  // Based on a handful of scans so far — flag it if a different prefix
  // letter ever turns up on a different label type.
  const ITEM_SCAN_PREFIX = 'P';

  // The pallet label's LPN barcode (not useful for search) decodes with a
  // "JBRG" prefix — scans starting with this get ignored entirely rather
  // than treated as an item code. Based on one label so far.
  const LPN_BLOCK_PREFIX = 'JBRG';

  const QR_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="14" width="2" height="2"/></svg>`;
  const PLUS_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  const INFO_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
  const CHECK_ICON_SVG = `<svg class="list-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  // ---- Usage list: a separate spreadsheet (On-hand + weekly usage),
  // loaded via Load File > Usage and matched onto the main item list by
  // Item code. Only the BRG site column is used since that's the only
  // one populated for this warehouse — the NDC/DNB columns in that file
  // are other sites and usually just show "-".
  const USAGE_COLUMNS = {
    code: 'Item',
    onHand: 'On-hand',
    weeklyUsage: 'Weekly Avg Usage BRG'
  };

  // A handful of real-shaped rows so the app is usable before you load your file
  const SAMPLE_ROWS = [
    { Locator: 'Loc A', Item: 'Product 1', 'Item Description': 'Product 1 Description goes here.', 'Primary UOM': 'UOM 1' },
    { Locator: 'Loc B', Item: 'Product 2', 'Item Description': 'Product 2 Description goes here.', 'Primary UOM': 'UOM 2' },
    { Locator: 'Loc C', Item: 'Product 3', 'Item Description': 'Product 3 Description goes here.', 'Primary UOM': 'UOM 3' },
    { Locator: 'Loc D', Item: 'Product 4', 'Item Description': 'Product 4 Description goes here.', 'Primary UOM': 'UOM 4' },
    { Locator: 'Loc E', Item: 'Product 5', 'Item Description': 'Product 5 Description goes here.', 'Primary UOM': 'UOM 5' }
  ];

  let items = [];
  let usageData = {};
  let usageLoaded = false;
  const searchEl = document.getElementById('search');
  const searchLocationEl = document.getElementById('search-location');
  const resultsEl = document.getElementById('results');
  const countRowEl = document.getElementById('count-row');
  const statusEl = document.getElementById('status');
  const loadTrigger = document.getElementById('load-trigger');
  const fileInput = document.getElementById('file-input');
  const loadMenuEl = document.getElementById('load-menu');
  const loadLocatorItem = document.getElementById('load-locator-item');
  const loadUsageItem = document.getElementById('load-usage-item');
  const usageFileInput = document.getElementById('usage-file-input');
  const infoOverlayEl = document.getElementById('info-overlay');
  const infoCodeEl = document.getElementById('info-code');
  const infoNameEl = document.getElementById('info-name');
  const infoStatsEl = document.getElementById('info-stats');
  const infoCloseEl = document.getElementById('info-close');
  const qrOverlayEl = document.getElementById('qr-overlay');
  const qrHolderEl = document.getElementById('qr-canvas-holder');
  const qrLabelEl = document.getElementById('qr-label');
  const qrCloseEl = document.getElementById('qr-close');
  const scanTrigger = document.getElementById('scan-trigger');
  const scanOverlayEl = document.getElementById('scan-overlay');
  const scanHintEl = document.getElementById('scan-hint');
  const scanCloseEl = document.getElementById('scan-close');
  const warnOverlayEl = document.getElementById('warn-overlay');
  const warnTextEl = document.getElementById('warn-text');
  const warnCloseEl = document.getElementById('warn-close');
  const scanTorchEl = document.getElementById('scan-torch');
  const micTrigger = document.getElementById('mic-trigger');
  const clearSearchEl = document.getElementById('clear-search');
  const clearLocationEl = document.getElementById('clear-location');
  const recentScansEl = document.getElementById('recent-scans');
  const listFabEl = document.getElementById('list-fab');
  const listFabCountEl = document.getElementById('list-fab-count');
  const toastEl = document.getElementById('toast');
  const listOverlayEl = document.getElementById('list-overlay');
  const listCountEl = document.getElementById('list-count');
  const listItemsEl = document.getElementById('list-items');
  const listClearEl = document.getElementById('list-clear');
  const listCloseEl = document.getElementById('list-close');
  let html5QrScanner = null;
  let torchOn = false;
  let recentScans = [];
  let pickList = [];
  let toastTimer = null;

  // ---- Sound: tiny generated tones, no audio files needed ----
  let audioCtx = null;
  function getAudioContext(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }
  // Unlock audio on the very first tap anywhere, so sounds triggered later
  // (e.g. from an async scan callback) are reliably audible.
  document.addEventListener('pointerdown', () => getAudioContext(), { once: true });

  function playTone({freq, duration = 150, type = 'sine', volume = 0.18, delay = 0}){
    const ctx = getAudioContext();
    if(!ctx) return;
    try{
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration / 1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration / 1000 + 0.03);
    }catch(e){}
  }

  function playScanBeep(){
    playTone({ freq: 1600, duration: 100, volume: 0.2 });
  }

  function playNoMatchTone(){
    playTone({ freq: 210, duration: 180, volume: 0.12 });
  }

  function playSplashFlourish(){
    playTone({ freq: 523.25, duration: 110, volume: 0.15, delay: 0 });
    playTone({ freq: 659.25, duration: 110, volume: 0.15, delay: 0.09 });
    playTone({ freq: 783.99, duration: 170, volume: 0.16, delay: 0.18 });
  }

  function playPopSound(pitch = 1){
    const ctx = getAudioContext();
    if(!ctx) return;
    try{
      const t0 = ctx.currentTime;
      const base = 500 * pitch;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * 1.8, t0);
      osc.frequency.exponentialRampToValueAtTime(base * 0.6, t0 + 0.09);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.13);
    }catch(e){}
  }

  function rowsToItems(rows){
    return rows.map(r => ({
      code: String(r[COLUMNS.code] ?? '').trim(),
      name: String(r[COLUMNS.name] ?? '').trim(),
      location: String(r[COLUMNS.location] ?? '').trim(),
      uom: String(r[COLUMNS.uom] ?? '').trim()
    })).filter(i => i.code || i.name);
  }

  function parseSpreadsheet(arrayBuffer){
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const items = rowsToItems(rows);
    const createdDate = (wb.Props && wb.Props.CreatedDate instanceof Date) ? wb.Props.CreatedDate : null;
    return { items, createdDate };
  }

  function parseUsageSpreadsheet(arrayBuffer){
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const map = {};
    rows.forEach(r => {
      const code = String(r[USAGE_COLUMNS.code] ?? '').trim();
      if(!code) return;
      const onHandRaw = r[USAGE_COLUMNS.onHand];
      const usageRaw = r[USAGE_COLUMNS.weeklyUsage];
      map[code.toUpperCase()] = {
        onHand: (onHandRaw === '' || onHandRaw === undefined || onHandRaw === '-') ? null : onHandRaw,
        weeklyUsage: (usageRaw === '' || usageRaw === undefined || usageRaw === '-') ? null : usageRaw
      };
    });
    return map;
  }

  function formatUKDate(d){
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return `${dd}/${mm}/${yy}`;
  }

  function daysBetween(earlier, later){
    const d1 = new Date(earlier.getFullYear(), earlier.getMonth(), earlier.getDate());
    const d2 = new Date(later.getFullYear(), later.getMonth(), later.getDate());
    return Math.round((d2 - d1) / 86400000);
  }

  function tierForAge(days){
    if(days <= 1) return 'green';
    if(days <= 2) return 'amber';
    return 'red';
  }

  function showScanWarning(message){
    warnTextEl.textContent = message;
    warnOverlayEl.classList.remove('hidden');
  }
  function hideScanWarning(){
    warnOverlayEl.classList.add('hidden');
  }
  warnCloseEl.addEventListener('click', hideScanWarning);
  warnOverlayEl.addEventListener('click', (e) => {
    if(e.target === warnOverlayEl) hideScanWarning();
  });

  let wasNoMatch = false;

  function render(list){
    if(items.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No file loaded</strong>Load your pick spreadsheet to start searching.</div>`;
      countRowEl.textContent = '';
      wasNoMatch = false;
      return;
    }
    if(list.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No matches</strong>Try a different code, description or location.</div>`;
      countRowEl.textContent = '';
      if(!wasNoMatch) playNoMatchTone();
      wasNoMatch = true;
      return;
    }
    wasNoMatch = false;
    countRowEl.textContent = `${list.length} of ${items.length} items`;
    resultsEl.innerHTML = list.map(i => `
      <div class="row">
        <div class="row-main">
          <div class="code-line">
            <span class="code">${escapeHTML(i.code)}</span>
            ${i.uom ? `<span class="uom-badge">${escapeHTML(i.uom)}</span>` : ''}
            ${i.code ? `<button class="qr-btn" data-qr="${escapeHTML(i.code)}" aria-label="Show QR for item code">${QR_ICON_SVG}</button>` : ''}
            ${i.code ? `<button class="info-btn" data-info="${escapeHTML(i.code)}" aria-label="Show usage info">${INFO_ICON_SVG}</button>` : ''}
          </div>
          <div class="name">${escapeHTML(i.name)}</div>
        </div>
        ${i.code ? `<button class="add-list-btn" data-code="${escapeHTML(i.code)}" aria-label="Add to pick list">${PLUS_ICON_SVG}</button>` : ''}
        ${i.location ? `
        <div class="loc-wrap">
          <div class="loc-badge">${escapeHTML(i.location)}</div>
          <button class="qr-btn" data-qr="${escapeHTML(LOCATION_QR_PREFIX + i.location)}" aria-label="Show QR for location">${QR_ICON_SVG}</button>
        </div>` : ''}
      </div>
    `).join('');
  }

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function doSearch(){
    const q = searchEl.value.trim().toLowerCase();
    const loc = searchLocationEl.value.trim().toLowerCase();
    clearSearchEl.hidden = !searchEl.value;
    clearLocationEl.hidden = !searchLocationEl.value;
    let filtered = items;
    if(q){
      filtered = filtered.filter(i => i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q));
    }
    if(loc){
      filtered = filtered.filter(i => i.location.toLowerCase().includes(loc));
    }
    render(filtered);
    return filtered;
  }

  clearSearchEl.addEventListener('click', () => {
    searchEl.value = '';
    doSearch();
    searchEl.focus();
  });
  clearLocationEl.addEventListener('click', () => {
    searchLocationEl.value = '';
    doSearch();
    searchLocationEl.focus();
  });

  function addRecentScan(value){
    recentScans = recentScans.filter(v => v !== value);
    recentScans.unshift(value);
    recentScans = recentScans.slice(0, 5);
    renderRecentScans();
  }

  function renderRecentScans(){
    if(recentScans.length === 0){
      recentScansEl.hidden = true;
      recentScansEl.innerHTML = '';
      return;
    }
    recentScansEl.hidden = false;
    recentScansEl.innerHTML = recentScans.map(v => `
      <button class="recent-chip" data-value="${escapeHTML(v)}">${escapeHTML(v)}</button>
    `).join('');
  }

  recentScansEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.recent-chip');
    if(!chip) return;
    searchEl.value = chip.dataset.value;
    doSearch();
  });

  function loadItems(list, label){
    items = list;
    statusEl.innerHTML = label;
    doSearch();
  }

  function showQR(text){
    qrLabelEl.textContent = text.indexOf(LOCATION_QR_PREFIX) === 0
      ? `PICK ${text.slice(LOCATION_QR_PREFIX.length)}`
      : text;
    qrHolderEl.innerHTML = '';
    new QRCode(qrHolderEl, {
      text: text,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
    qrOverlayEl.classList.remove('hidden');
  }

  function hideQR(){
    qrOverlayEl.classList.add('hidden');
  }

  function formatUsageNumber(n){
    if(n === null || n === undefined || n === '') return '—';
    const num = Number(n);
    if(Number.isNaN(num)) return String(n);
    return Number.isInteger(num) ? String(num) : num.toFixed(1);
  }

  function showInfo(code){
    const item = items.find(i => i.code === code);
    infoCodeEl.textContent = code;
    infoNameEl.textContent = item ? item.name : '';

    if(!usageLoaded){
      infoStatsEl.innerHTML = `<div class="info-empty">No usage data loaded yet.<br>Tap Load File &rarr; Usage to add it.</div>`;
    }else{
      const stats = usageData[code.toUpperCase()];
      if(!stats){
        infoStatsEl.innerHTML = `<div class="info-empty">No usage data for this item.</div>`;
      }else{
        infoStatsEl.innerHTML = `
          <div class="info-stat-row"><span class="info-stat-label">On-hand</span><span class="info-stat-value">${escapeHTML(formatUsageNumber(stats.onHand))}</span></div>
          <div class="info-stat-row"><span class="info-stat-label">Weekly avg usage (BRG)</span><span class="info-stat-value">${escapeHTML(formatUsageNumber(stats.weeklyUsage))}</span></div>
        `;
      }
    }
    infoOverlayEl.classList.remove('hidden');
  }

  function hideInfo(){
    infoOverlayEl.classList.add('hidden');
  }

  infoCloseEl.addEventListener('click', hideInfo);
  infoOverlayEl.addEventListener('click', (e) => {
    if(e.target === infoOverlayEl) hideInfo();
  });

  resultsEl.addEventListener('click', (e) => {
    const infoBtn = e.target.closest('.info-btn');
    if(infoBtn){
      showInfo(infoBtn.dataset.info);
      return;
    }
    const qrBtn = e.target.closest('.qr-btn');
    if(qrBtn){
      showQR(qrBtn.dataset.qr);
      return;
    }
    const addBtn = e.target.closest('.add-list-btn');
    if(addBtn){
      addToPickList(addBtn.dataset.code);
    }
  });

  qrOverlayEl.addEventListener('click', (e) => {
    if(e.target === qrOverlayEl) hideQR();
  });
  qrCloseEl.addEventListener('click', hideQR);

  // ---- Pick list ----
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  // Sorts by location zone alphabetically (AA, BB, HH, ZZ...), then
  // numerically within items sharing the same zone (so "0.0.8" sorts
  // before "0.0.26", not after, as a plain string sort would do).
  function compareLocations(a, b){
    const pa = String(a || '').split('.');
    const pb = String(b || '').split('.');
    const zoneA = pa[0] || '';
    const zoneB = pb[0] || '';
    if(zoneA !== zoneB) return zoneA.localeCompare(zoneB);
    const restA = pa.slice(1).map(n => parseInt(n, 10) || 0);
    const restB = pb.slice(1).map(n => parseInt(n, 10) || 0);
    const len = Math.max(restA.length, restB.length);
    for(let i = 0; i < len; i++){
      const va = restA[i] ?? 0;
      const vb = restB[i] ?? 0;
      if(va !== vb) return va - vb;
    }
    return 0;
  }

  function addToPickList(code){
    const item = items.find(i => i.code === code);
    if(!item) return;
    if(pickList.some(p => p.code === code)){
      showToast('Already added');
      return;
    }
    pickList.push(item);
    updateFab();
    showToast('Added to list');
  }

  function updateFab(){
    listFabEl.hidden = pickList.length === 0;
    listFabCountEl.textContent = pickList.length;
    listCountEl.textContent = pickList.length;
  }

  function renderPickList(){
    listCountEl.textContent = pickList.length;
    if(pickList.length === 0){
      listItemsEl.innerHTML = `<div class="list-empty">Nothing on the list yet — tap the + next to an item to add it.</div>`;
      return;
    }
    const sorted = [...pickList].sort((a, b) => compareLocations(a.location, b.location));
    listItemsEl.innerHTML = sorted.map(i => `
      <div class="list-row">
        <div class="row-main">
          <div class="code-line">
            <span class="code">${escapeHTML(i.code)}</span>
            ${i.uom ? `<span class="uom-badge">${escapeHTML(i.uom)}</span>` : ''}
          </div>
          <div class="name">${escapeHTML(i.name)}</div>
        </div>
        ${i.location ? `<div class="loc-badge">${escapeHTML(i.location)}</div>` : ''}
        <button class="list-check-btn" data-code="${escapeHTML(i.code)}" aria-label="Mark as put away">${CHECK_ICON_SVG}</button>
      </div>
    `).join('');
  }

  const PREFERS_REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  listItemsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.list-check-btn');
    if(!btn || btn.disabled) return;
    btn.disabled = true;
    btn.classList.add('checked');
    const row = btn.closest('.list-row');
    const code = btn.dataset.code;

    const finish = () => {
      pickList = pickList.filter(p => p.code !== code);
      renderPickList();
      updateFab();
      if(pickList.length === 0) showToast('All items put away');
    };

    if(PREFERS_REDUCED_MOTION){
      finish();
      return;
    }

    // Tick shows first, then the row slides out and fades (0.25s), then it
    // collapses — which is what pushes the rows below it up into place.
    setTimeout(() => { if(row) row.classList.add('removing'); }, 150);
    setTimeout(finish, 700);
  });

  listClearEl.addEventListener('click', () => {
    pickList = [];
    renderPickList();
    updateFab();
    hideListPanel();
  });

  function openListPanel(){
    renderPickList();
    listOverlayEl.classList.remove('hidden');
  }
  function hideListPanel(){
    listOverlayEl.classList.add('hidden');
  }
  listCloseEl.addEventListener('click', hideListPanel);
  listOverlayEl.addEventListener('click', (e) => {
    if(e.target === listOverlayEl) hideListPanel();
  });

  // Draggable FAB — a tap (no meaningful movement) opens the list;
  // a drag repositions it instead.
  let fabDragging = false;
  let fabMoved = false;
  let fabStartX = 0, fabStartY = 0, fabOrigX = 0, fabOrigY = 0;

  listFabEl.addEventListener('pointerdown', (e) => {
    fabDragging = true;
    fabMoved = false;
    fabStartX = e.clientX;
    fabStartY = e.clientY;
    const rect = listFabEl.getBoundingClientRect();
    fabOrigX = rect.left;
    fabOrigY = rect.top;
    listFabEl.setPointerCapture(e.pointerId);
  });

  listFabEl.addEventListener('pointermove', (e) => {
    if(!fabDragging) return;
    const dx = e.clientX - fabStartX;
    const dy = e.clientY - fabStartY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) fabMoved = true;
    if(fabMoved){
      const maxX = window.innerWidth - listFabEl.offsetWidth - 8;
      const maxY = window.innerHeight - listFabEl.offsetHeight - 8;
      const newX = Math.min(Math.max(8, fabOrigX + dx), maxX);
      const newY = Math.min(Math.max(8, fabOrigY + dy), maxY);
      listFabEl.style.left = newX + 'px';
      listFabEl.style.top = newY + 'px';
      listFabEl.style.right = 'auto';
      listFabEl.style.bottom = 'auto';
    }
  });

  listFabEl.addEventListener('pointerup', () => {
    fabDragging = false;
    if(!fabMoved) openListPanel();
  });

  function startScan(){
    scanHintEl.textContent = 'Point the camera at a QR code';
    scanTorchEl.hidden = true;
    scanTorchEl.classList.remove('on');
    torchOn = false;
    scanOverlayEl.classList.remove('hidden');
    html5QrScanner = new Html5Qrcode('scan-region');
    html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 200 },
      onScanSuccess,
      () => {} // ignore per-frame "no code found" noise
    ).then(() => {
      try{
        const torch = html5QrScanner.getRunningTrackCameraCapabilities().torchFeature();
        scanTorchEl.hidden = !(torch && torch.isSupported());
      }catch(e){
        scanTorchEl.hidden = true;
      }
    }).catch(() => {
      scanHintEl.textContent = "Couldn't access the camera — check camera permission for this app.";
    });
  }

  function stopScan(){
    if(html5QrScanner){
      const s = html5QrScanner;
      html5QrScanner = null;
      s.stop().then(() => s.clear()).catch(() => {});
    }
    scanOverlayEl.classList.add('hidden');
    scanTorchEl.hidden = true;
    scanTorchEl.classList.remove('on');
    torchOn = false;
  }

  scanTorchEl.addEventListener('click', () => {
    if(!html5QrScanner) return;
    try{
      const torch = html5QrScanner.getRunningTrackCameraCapabilities().torchFeature();
      torchOn = !torchOn;
      torch.apply(torchOn).then(() => {
        scanTorchEl.classList.toggle('on', torchOn);
      }).catch(() => {});
    }catch(e){}
  });

  function onScanSuccess(decodedText){
    if(decodedText.indexOf(LPN_BLOCK_PREFIX) === 0){
      // Not a useful code (the pallet label's LPN barcode) — ignore it and
      // keep the camera running rather than treating it as an item code.
      scanHintEl.textContent = "That's the pallet LPN barcode — scan the Item barcode instead.";
      return;
    }

    stopScan();
    playScanBeep();
    if(navigator.vibrate) navigator.vibrate(60);

    if(decodedText.indexOf(LOCATION_QR_PREFIX) === 0){
      const loc = decodedText.slice(LOCATION_QR_PREFIX.length);
      searchLocationEl.value = loc;
      const results = doSearch();
      if(items.length > 0 && results.length === 0){
        showScanWarning('No assigned stock to location!');
      }
      return;
    }

    const code = decodedText.indexOf(ITEM_SCAN_PREFIX) === 0
      ? decodedText.slice(ITEM_SCAN_PREFIX.length)
      : decodedText;
    searchEl.value = code;
    addRecentScan(code);
    doSearch();
    const found = items.find(i => i.code.toLowerCase() === code.toLowerCase());
    if(found && !found.location){
      showScanWarning('No location assigned to item!');
    }
  }

  scanTrigger.addEventListener('click', startScan);
  scanCloseEl.addEventListener('click', stopScan);
  scanOverlayEl.addEventListener('click', (e) => {
    if(e.target === scanOverlayEl) stopScan();
  });

  // ---- Voice search (code/description field only — spoken location
  // codes like "CC.0.0.020" don't transcribe reliably) ----
  // Speech recognition tends to insert a space at letter/digit boundaries
  // (e.g. "MXA085" comes through as "MXA 085") and never capitalises —
  // this closes those gaps and uppercases for consistency with how codes
  // are shown everywhere else in the app.
  function cleanVoiceText(text){
    let t = text.trim().toUpperCase();
    t = t.replace(/([A-Z])\s+(\d)/g, '$1$2').replace(/(\d)\s+([A-Z])/g, '$1$2');
    return t;
  }

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  function startVoiceSearch(){
    if(!SpeechRec) return;
    if(listening){
      recognition && recognition.stop();
      return;
    }
    recognition = new SpeechRec();
    recognition.lang = 'en-GB';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micTrigger.classList.add('listening');
    };
    recognition.onresult = (e) => {
      searchEl.value = cleanVoiceText(e.results[0][0].transcript);
      doSearch();
    };
    recognition.onerror = () => {};
    recognition.onend = () => {
      listening = false;
      micTrigger.classList.remove('listening');
    };
    recognition.start();
  }

  micTrigger.addEventListener('click', startVoiceSearch);

  searchEl.addEventListener('input', doSearch);
  searchLocationEl.addEventListener('input', doSearch);
  loadTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    loadMenuEl.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if(loadMenuEl.classList.contains('hidden')) return;
    if(loadMenuEl.contains(e.target) || e.target === loadTrigger) return;
    loadMenuEl.classList.add('hidden');
  });
  loadLocatorItem.addEventListener('click', () => {
    loadMenuEl.classList.add('hidden');
    fileInput.click();
  });
  loadUsageItem.addEventListener('click', () => {
    loadMenuEl.classList.add('hidden');
    usageFileInput.click();
  });

  usageFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const map = parseUsageSpreadsheet(evt.target.result);
        const count = Object.keys(map).length;
        if(count === 0){
          throw new Error('No rows found — check the column headers match.');
        }
        usageData = map;
        usageLoaded = true;
        showToast(`Usage data loaded (${count} items)`);
      }catch(err){
        showToast("Couldn't read usage file");
      }
    };
    reader.readAsArrayBuffer(file);
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const result = parseSpreadsheet(evt.target.result);
        if(result.items.length === 0){
          throw new Error('No rows found — check the column headers match.');
        }
        const createdDate = result.createdDate || new Date(file.lastModified);
        const days = daysBetween(createdDate, new Date());
        const tier = tierForAge(days);
        statusEl.className = `status status-pill tier-${tier}`;
        loadItems(result.items, `Database Created: ${formatUKDate(createdDate)}`);
        if(tier === 'red') showScanWarning('Data is over 2 days old, please check if Data is still valid!');
      }catch(err){
        statusEl.className = 'status';
        statusEl.textContent = 'Load failed';
        resultsEl.innerHTML = `<div class="empty"><strong>Couldn't read that file</strong>${escapeHTML(err.message)}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // start with sample data so the app is usable immediately
  statusEl.className = 'status';
  loadItems(rowsToItems(SAMPLE_ROWS), 'demo data<span class="demo-tag">SAMPLE</span>');

  // Timed to the new splash sequence: door opens + glass sweeps (0-1.6s),
  // boxes pop in one at a time (2.0s/2.7s/3.4s), "WyApps" slides in at the
  // same moment as the last crate pop (3.4s).
  // May be silently blocked by the browser on the very first open or two
  // (autoplay policy) until it's seen you interact with the app at least
  // once — the animation itself always plays regardless.
  setTimeout(() => playPopSound(1), 2000);
  setTimeout(() => playPopSound(1.15), 2700);
  setTimeout(() => playPopSound(1.3), 3400);
  setTimeout(playSplashFlourish, 3400);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
