<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14171A">
<title>Stock Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#14171A;
    --panel:#1C2024;
    --panel-alt:#22262B;
    --border:#2C3238;
    --text:#E7E5E0;
    --text-dim:#8A9099;
    --accent:#F2A93B;
    --accent-dim:#C98A2E;
    --badge:#4FD6C0;
    --badge-text:#0B1512;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--border);
  }

  .titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }

  h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }

  .status{
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .search-row{
    display:flex;
    gap:8px;
  }

  .search-row.secondary{
    margin-top:8px;
  }

  input[type="search"]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    padding:12px 14px;
    outline:none;
    min-width:0;
  }

  input[type="search"]:focus{
    border-color:var(--accent-dim);
  }

  input[type="search"]::placeholder{
    color:var(--text-dim);
  }

  .load-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:0 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }

  .load-btn:active{
    background:var(--border);
  }

  #file-input{ display:none; }

  main{
    flex:1;
    overflow-y:auto;
    padding:6px 0 40px;
  }

  .count-row{
    padding:12px 18px 4px;
    font-size:12px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
  }

  .row{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }

  .row-main{ min-width:0; }

  .code-line{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .code{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:14.5px;
    color:var(--accent);
    letter-spacing:0.3px;
  }

  .uom-badge,
  .loc-badge{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:var(--badge-text);
    background:var(--badge);
    border-radius:7px;
    padding:5px 10px;
    line-height:1.3;
    flex-shrink:0;
    white-space:nowrap;
  }

  .name{
    font-size:13.5px;
    color:var(--text);
    margin-top:3px;
    line-height:1.4;
  }



  .empty{
    padding:60px 30px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
  }

  .empty strong{
    display:block;
    color:var(--text);
    font-size:15px;
    margin-bottom:6px;
    font-weight:600;
  }

  .demo-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--bg);
    background:var(--accent);
    padding:2px 6px;
    border-radius:4px;
    margin-left:6px;
    vertical-align:middle;
  }

  @property --mx { syntax: '<length>'; inherits: true; initial-value: 32px; }
  @property --my { syntax: '<length>'; inherits: true; initial-value: 115px; }
  @property --mr { syntax: '<length>'; inherits: true; initial-value: 26px; }

  .splash{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation: splash-out 0.5s ease 1.7s forwards;
  }

  .splash-stage{
    position:relative;
    width:160px;
    height:160px;
  }

  .warehouse-icon{
    position:absolute;
    inset:0;
    -webkit-mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my), black 55%, transparent 65%);
    mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my), black 55%, transparent 65%);
    animation: reveal-mask 1.5s cubic-bezier(.45,0,.2,1) forwards;
  }

  .glass-wrap{
    position:absolute;
    top:0; left:0;
    width:56px;
    height:56px;
    animation: glass-move 1.5s cubic-bezier(.45,0,.2,1) forwards;
  }

  @keyframes reveal-mask{
    0%   { --mx:32px;  --my:115px; --mr:26px; }
    25%  { --mx:118px; --my:42px;  --mr:26px; }
    50%  { --mx:48px;  --my:35px;  --mr:26px; }
    75%  { --mx:112px; --my:118px; --mr:26px; }
    100% { --mx:80px;  --my:80px;  --mr:190px; }
  }

  @keyframes glass-move{
    0%   { transform: translate(10px, 93px); opacity:1; }
    25%  { transform: translate(96px, 20px); }
    50%  { transform: translate(26px, 13px); }
    75%  { transform: translate(90px, 96px); }
    88%  { transform: translate(58px, 58px); opacity:1; }
    100% { transform: translate(58px, 58px); opacity:0; }
  }

  @keyframes splash-out{
    to{ opacity:0; visibility:hidden; }
  }

  .code-line{ flex-wrap:wrap; }

  .qr-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:23px;
    height:23px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel-alt);
    color:var(--text-dim);
    flex-shrink:0;
    padding:0;
    cursor:pointer;
  }
  .qr-btn svg{ width:13px; height:13px; }
  .qr-btn:active{ background:var(--border); }

  .loc-wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
  }

  .qr-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:24px;
  }
  .qr-overlay.hidden{ display:none; }

  .qr-card{
    background:#F5F4F0;
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:280px;
    width:100%;
  }
  #qr-canvas-holder{
    width:220px;
    height:220px;
    background:#fff;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .qr-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#14171A;
    text-align:center;
    word-break:break-all;
  }
  .qr-close{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#14171A;
    background:#E2DFD6;
    border:none;
    border-radius:8px;
    padding:9px 20px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-stage">
    <svg class="warehouse-icon" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#4FD6C0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 130 L38 78 L28 78 L80 20 L132 78 L122 78 L122 130"/>
        <line x1="58" y1="48" x2="102" y2="48"/>
        <line x1="58" y1="62" x2="102" y2="62"/>
        <rect x="52" y="88" width="56" height="42"/>
        <rect x="70" y="92" width="19" height="18"/>
        <rect x="55" y="110" width="19" height="18"/>
        <rect x="85" y="110" width="19" height="18"/>
      </g>
    </svg>
    <div class="glass-wrap">
      <svg class="glass-icon" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="14" fill="none" stroke="#F2A93B" stroke-width="6"/>
        <circle cx="22" cy="22" r="5" fill="#4FD6C0"/>
        <line x1="32" y1="32" x2="46" y2="46" stroke="#F2A93B" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>
<div class="app">
  <header>
    <div class="titlebar">
      <h1>Stock Finder</h1>
      <span class="status" id="status">demo data<span class="demo-tag">SAMPLE</span></span>
    </div>
    <div class="search-row">
      <input type="search" id="search" placeholder="Search code or description..." autocomplete="off">
      <button class="load-btn" id="load-trigger">Load File</button>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
    </div>
    <div class="search-row secondary">
      <input type="search" id="search-location" placeholder="Search location..." autocomplete="off">
    </div>
  </header>

  <main id="main">
    <div class="count-row" id="count-row"></div>
    <div id="results"></div>
  </main>
</div>

<div class="qr-overlay hidden" id="qr-overlay">
  <div class="qr-card">
    <div id="qr-canvas-holder"></div>
    <div class="qr-label" id="qr-label"></div>
    <button class="qr-close" id="qr-close">Close</button>
  </div>
</div>

<script>
  // ---- Column mapping: matches the Pick Spreadsheet headers ----
  // Locator | Item | Item Description | Rev | Primary UOM | On-hand
  const COLUMNS = {
    code: 'Item',
    name: 'Item Description',
    location: 'Locator',
    uom: 'Primary UOM'
  };

  // ---- QR format: matches your warehouse's real labels ----
  // Item QR = just the bare item code (confirmed from a real label, e.g. "MXA085")
  // Location QR = a prefix + the locator text (confirmed from a real label: "1LPICK#CC.0.0.020")
  // Only tested against one location label so far — if a QR from a different
  // aisle/zone ever decodes with a different prefix, update this constant.
  const LOCATION_QR_PREFIX = '1LPICK#';

  const QR_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="14" width="2" height="2"/></svg>`;

  // A handful of real-shaped rows so the app is usable before you load your file
  const SAMPLE_ROWS = [
    { Locator: 'Loc A', Item: 'Product 1', 'Item Description': 'Product 1 Description goes here.', 'Primary UOM': 'UOM 1' },
    { Locator: 'Loc B', Item: 'Product 2', 'Item Description': 'Product 2 Description goes here.', 'Primary UOM': 'UOM 2' },
    { Locator: 'Loc C', Item: 'Product 3', 'Item Description': 'Product 3 Description goes here.', 'Primary UOM': 'UOM 3' },
    { Locator: 'Loc D', Item: 'Product 4', 'Item Description': 'Product 4 Description goes here.', 'Primary UOM': 'UOM 4' },
    { Locator: 'Loc E', Item: 'Product 5', 'Item Description': 'Product 5 Description goes here.', 'Primary UOM': 'UOM 5' }
  ];

  let items = [];
  const searchEl = document.getElementById('search');
  const searchLocationEl = document.getElementById('search-location');
  const resultsEl = document.getElementById('results');
  const countRowEl = document.getElementById('count-row');
  const statusEl = document.getElementById('status');
  const loadTrigger = document.getElementById('load-trigger');
  const fileInput = document.getElementById('file-input');
  const qrOverlayEl = document.getElementById('qr-overlay');
  const qrHolderEl = document.getElementById('qr-canvas-holder');
  const qrLabelEl = document.getElementById('qr-label');
  const qrCloseEl = document.getElementById('qr-close');

  function rowsToItems(rows){
    return rows.map(r => ({
      code: String(r[COLUMNS.code] ?? '').trim(),
      name: String(r[COLUMNS.name] ?? '').trim(),
      location: String(r[COLUMNS.location] ?? '').trim(),
      uom: String(r[COLUMNS.uom] ?? '').trim()
    })).filter(i => i.code || i.name);
  }

  function parseSpreadsheet(arrayBuffer){
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    return rowsToItems(rows);
  }

  function render(list){
    if(items.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No file loaded</strong>Load your pick spreadsheet to start searching.</div>`;
      countRowEl.textContent = '';
      return;
    }
    if(list.length === 0){
      resultsEl.innerHTML = `<div class="empty"><strong>No matches</strong>Try a different code, description or location.</div>`;
      countRowEl.textContent = '';
      return;
    }
    countRowEl.textContent = `${list.length} of ${items.length} items`;
    resultsEl.innerHTML = list.map(i => `
      <div class="row">
        <div class="row-main">
          <div class="code-line">
            <span class="code">${escapeHTML(i.code)}</span>
            ${i.uom ? `<span class="uom-badge">${escapeHTML(i.uom)}</span>` : ''}
            ${i.code ? `<button class="qr-btn" data-qr="${escapeHTML(i.code)}" aria-label="Show QR for item code">${QR_ICON_SVG}</button>` : ''}
          </div>
          <div class="name">${escapeHTML(i.name)}</div>
        </div>
        ${i.location ? `
        <div class="loc-wrap">
          <div class="loc-badge">${escapeHTML(i.location)}</div>
          <button class="qr-btn" data-qr="${escapeHTML(LOCATION_QR_PREFIX + i.location)}" aria-label="Show QR for location">${QR_ICON_SVG}</button>
        </div>` : ''}
      </div>
    `).join('');
  }

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function doSearch(){
    const q = searchEl.value.trim().toLowerCase();
    const loc = searchLocationEl.value.trim().toLowerCase();
    let filtered = items;
    if(q){
      filtered = filtered.filter(i => i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q));
    }
    if(loc){
      filtered = filtered.filter(i => i.location.toLowerCase().includes(loc));
    }
    render(filtered);
  }

  function loadItems(list, label){
    items = list;
    statusEl.innerHTML = label;
    doSearch();
  }

  function showQR(text){
    qrLabelEl.textContent = text;
    qrHolderEl.innerHTML = '';
    new QRCode(qrHolderEl, {
      text: text,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
    qrOverlayEl.classList.remove('hidden');
  }

  function hideQR(){
    qrOverlayEl.classList.add('hidden');
  }

  resultsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.qr-btn');
    if(!btn) return;
    showQR(btn.dataset.qr);
  });

  qrOverlayEl.addEventListener('click', (e) => {
    if(e.target === qrOverlayEl) hideQR();
  });
  qrCloseEl.addEventListener('click', hideQR);

  searchEl.addEventListener('input', doSearch);
  searchLocationEl.addEventListener('input', doSearch);
  loadTrigger.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const parsed = parseSpreadsheet(evt.target.result);
        if(parsed.length === 0){
          throw new Error('No rows found — check the column headers match.');
        }
        loadItems(parsed, file.name);
      }catch(err){
        statusEl.textContent = 'Load failed';
        resultsEl.innerHTML = `<div class="empty"><strong>Couldn't read that file</strong>${escapeHTML(err.message)}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // start with sample data so the app is usable immediately
  loadItems(rowsToItems(SAMPLE_ROWS), 'demo data<span class="demo-tag">SAMPLE</span>');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
